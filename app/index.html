<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>HEARTROT</title>
    <!-- The boss's core, the vent every raid is trying to open: the one shape in this game
         that still reads at 16 px. SVG first for anything modern, a rendered PNG behind it
         for the browsers that never learned to scale one in a tab. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Only what stops a white flash before React mounts. Real styling lives in src/. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #0b0a0c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
