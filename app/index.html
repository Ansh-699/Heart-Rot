<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>HEARTROT</title>
    <meta name="description" content="A co-op boss raid where every move and every arrow is a Solana transaction." />
    <!-- The social card: the same lede the landing opens with, over the clip's poster. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://heartrot.ansht.workers.dev/" />
    <meta property="og:title" content="HEARTROT" />
    <meta property="og:description" content="A co-op boss raid where every move and every arrow is a Solana transaction." />
    <meta property="og:image" content="https://heartrot.ansht.workers.dev/clip.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HEARTROT" />
    <meta name="twitter:description" content="A co-op boss raid where every move and every arrow is a Solana transaction." />
    <meta name="twitter:image" content="https://heartrot.ansht.workers.dev/clip.jpg" />
    <!-- The boss's core, the vent every raid is trying to open: the one shape in this game
         that still reads at 16 px. SVG first for anything modern, a rendered PNG behind it
         for the browsers that never learned to scale one in a tab. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The first request to the rollup and to its router otherwise pays DNS, TCP and TLS cold
         at link time (~150 ms measured). These hosts are also VALIDATOR/ROUTER vars in
         worker/wrangler.jsonc; a move there must move here. `crossorigin`: the client's fetches
         are uncredentialed CORS, and Chrome keys warm sockets by that mode. -->
    <link rel="preconnect" href="https://devnet-as.magicblock.app" crossorigin />
    <link rel="preconnect" href="https://devnet-router.magicblock.app" crossorigin />
    <style>
      /* Only what stops a white flash before React mounts. Real styling lives in src/. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #0b0a0c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
