<!doctype html><meta charset="utf-8"><style>body{margin:0}
#a{transform: rotate(90deg)}
#b{transform: rotate(90deg); transform-box: fill-box; transform-origin: center}
</style>
<svg viewBox="0 0 230 270" width="230" height="270">
  <g id="a"><rect id="ra" x="150" y="20" width="40" height="10" fill="red"/></g>
  <g id="b"><rect id="rb" x="150" y="60" width="40" height="10" fill="blue"/></g>
</svg>
<script>
const g = (id) => { const r = document.getElementById(id).getBoundingClientRect();
  return id + ' x=' + r.x.toFixed(1) + ' y=' + r.y.toFixed(1) + ' w=' + r.width.toFixed(1) + ' h=' + r.height.toFixed(1); };
window.__result = ['default transform-box (view-box): ' + g('ra'),
                   'fill-box + center:               ' + g('rb'),
                   'computed transform-box on #a: ' + getComputedStyle(document.getElementById('a')).transformBox,
                   'computed transform-origin on #a: ' + getComputedStyle(document.getElementById('a')).transformOrigin];
document.title='DONE';
</script>
